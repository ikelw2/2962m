name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # GITHUB_TOKEN pushes from the weather workflow do not trigger push workflows.
  workflow_run:
    workflows: ["Update Weather Status"]
    types: [completed]
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying static files
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-widget/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: react-widget

      - name: Build Project
        run: npm run build
        working-directory: react-widget

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site/react-widget
          cp *.html *.css *.js *.jpg *.avif *.webp *.ico _site/
          cp weather_status.json _site/
          cp -R react-widget/dist _site/react-widget/
          test -f _site/react-widget/dist/assets/index.js
          test -f _site/weather_status.json

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

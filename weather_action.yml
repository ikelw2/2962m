name: Update Hike Planning Weather Status
on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.34"

      - name: Install Perl Dependencies
        run: cpanm LWP::UserAgent JSON::PP LWP::Protocol::https

      - name: Run Weather Analysis
        run: perl weather_analyze.pl

      - name: Commit and Push update
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "actions@github.com"
          git add weather_status.json
          git diff-index --quiet HEAD || git commit -m "Weather Widget Update"
          git push
